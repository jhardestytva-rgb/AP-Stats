<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Statistics Unit 2 Vocabulary Flashcards</title>
  <style>
    :root {
      --navy: #0C2340;
      --gold: #FFD600;
      --white: #FFFFFF;
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--navy);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      border: 2px solid var(--gold);
      border-radius: 12px;
      background: var(--navy);
      color: var(--gold);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 0.7rem 1rem;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    button:hover, button:focus-visible {
      background: var(--gold);
      color: var(--navy);
      outline: none;
    }

    button:active { transform: scale(0.97); }
    button * { pointer-events: none; }

    .app {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
      text-align: center;
    }

    header { margin-bottom: 1.5rem; }

    .brand {
      color: var(--gold);
      font-size: clamp(1.2rem, 3vw, 1.65rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0;
      text-transform: uppercase;
    }

    h1 {
      color: var(--white);
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      margin: 0.25rem 0 0;
    }

    .subtitle {
      color: var(--white);
      font-size: 1.05rem;
      margin: 0.45rem 0 0;
      opacity: 0.88;
    }

    .counter {
      color: var(--white);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.55rem;
    }

    .progress-track {
      width: min(560px, 100%);
      height: 7px;
      margin: 0 auto 1.35rem;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
    }

    .progress-bar {
      width: 3.58%;
      height: 100%;
      background: var(--gold);
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .card-scene {
      width: min(560px, 100%);
      height: 320px;
      margin: 0 auto 1.4rem;
      perspective: 1200px;
    }

    .flashcard {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }

    .flashcard.is-flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      border: 3px solid var(--gold);
      border-radius: 12px;
      box-shadow: 0 12px 28px var(--shadow);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      background: var(--navy);
      color: var(--white);
    }

    .card-front h2 {
      margin: 0;
      font-size: clamp(1.55rem, 5vw, 2rem);
      line-height: 1.2;
    }

    .card-back {
      background: var(--white);
      color: var(--navy);
      font-size: 1rem;
      line-height: 1.55;
      text-align: left;
      transform: rotateY(180deg);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.7rem;
      margin: 0 auto 1rem;
    }

    .hint {
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.9rem;
      margin: 0;
    }

    @media (max-width: 620px) {
      .app { padding-top: 1.35rem; }
      .card-scene { height: 300px; }
      .card-face { padding: 1.4rem; }
      .controls button { flex: 1 1 40%; }
    }

    .print-grid { display: none; }

    @media print {
      @page { margin: 0.5in; }

      body { background: var(--navy); }
      .app { width: 100%; max-width: none; padding: 0; }
      header { margin-bottom: 0.35in; }
      .controls, .hint, .counter, .progress-track, .card-scene { display: none !important; }

      .print-grid {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        gap: 0.18in;
      }

      .print-card {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 1.55in;
        overflow: hidden;
        border: 2px solid var(--gold);
        border-radius: 12px;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .print-term, .print-definition {
        display: flex;
        align-items: center;
        padding: 0.18in;
      }

      .print-term {
        justify-content: center;
        background: var(--navy);
        color: var(--white);
        font-size: 0.82rem;
        font-weight: 700;
        text-align: center;
      }

      .print-definition {
        background: var(--white);
        border-left: 2px dashed var(--navy);
        color: var(--navy);
        font-size: 0.69rem;
        line-height: 1.3;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header>
      <p class="brand">AP Statistics</p>
      <h1>Unit 2 Vocabulary</h1>
      <p class="subtitle">Probability, Random Variables &amp; Probability Distributions</p>
    </header>

    <div class="counter" id="counter" aria-live="polite">Card 1 of 28</div>
    <div class="progress-track" aria-label="Deck progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <section class="card-scene" aria-label="Current flashcard">
      <div class="flashcard" id="flashcard" data-action="flip" tabindex="0" role="button" aria-label="Flashcard. Click to flip.">
        <div class="card-face card-front">
          <h2 id="termText"></h2>
        </div>
        <div class="card-face card-back">
          <p id="definitionText"></p>
        </div>
      </div>
    </section>

    <div class="controls">
      <button type="button" data-action="previous">Previous</button>
      <button type="button" data-action="next">Next</button>
      <button type="button" data-action="shuffle">Shuffle</button>
      <button type="button" data-action="print">Print All Cards</button>
      <button type="button" data-action="reset">Reset</button>
    </div>

    <p class="hint">Click the card to flip • Use ← → to navigate • Press Space to flip</p>
    <section class="print-grid" id="printGrid" aria-label="Printable flashcards"></section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const originalCards = [
        { term: 'Two-Way Table', definition: 'A table (also called a contingency table) used to summarize data for two categorical variables. Cells show frequencies or relative frequencies.' },
        { term: 'Joint Relative Frequency', definition: 'A cell frequency in a two-way table divided by the total for the entire table.' },
        { term: 'Marginal Relative Frequency', definition: 'A row total or column total in a two-way table divided by the grand total.' },
        { term: 'Conditional Relative Frequency', definition: 'A relative frequency computed by restricting to a particular row or column of a two-way table.' },
        { term: 'Random Process', definition: 'A process that generates results determined by chance.' },
        { term: 'Outcome', definition: 'The result of one trial of a random process.' },
        { term: 'Event', definition: 'A collection of outcomes from a random process.' },
        { term: 'Simulation', definition: 'A method of modeling random events so that simulated outcomes closely match real-world outcomes.' },
        { term: 'Probability', definition: 'The long-run relative frequency of an outcome or event over a large number of trials.' },
        { term: 'Law of Large Numbers', definition: 'For independent trials, as the number of trials increases, the long-run relative frequency of an outcome gets closer to its true probability.' },
        { term: 'Sample Space', definition: 'The set of all possible non-overlapping outcomes of a random process. The probability of the sample space is 1.' },
        { term: 'Complement', definition: "The complement of event E (written Eᶜ or E') is the event that E does not occur. P(Eᶜ) = 1 − P(E)." },
        { term: 'Mutually Exclusive Events', definition: 'Two events that cannot occur at the same time. Also called disjoint events. P(A ∩ B) = 0.' },
        { term: 'Joint Probability', definition: 'The probability that two events both occur: P(A ∩ B).' },
        { term: 'Conditional Probability', definition: 'The probability that event A occurs given that event B has occurred: P(A|B) = P(A ∩ B) / P(B).' },
        { term: 'General Multiplication Rule', definition: 'P(A ∩ B) = P(A) · P(B|A). Used to find the probability that both events A and B occur.' },
        { term: 'Independent Events', definition: 'Events A and B are independent if knowing whether A occurred does not change the probability of B. P(A ∩ B) = P(A) · P(B).' },
        { term: 'Union of Events', definition: 'The event that A or B (or both) occur: P(A ∪ B) = P(A) + P(B) − P(A ∩ B).' },
        { term: 'Random Variable', definition: 'A variable whose numerical values result from a random phenomenon.' },
        { term: 'Probability Distribution', definition: 'Shows the probability associated with every possible value of a discrete random variable. All probabilities sum to 1.' },
        { term: 'Expected Value (Mean)', definition: 'The long-run average outcome of a random variable. For discrete X: μ = Σ[xᵢ · P(xᵢ)]. Denoted E(X) or μₓ.' },
        { term: 'Standard Deviation of a Random Variable', definition: 'A measure of the typical deviation of a random variable\'s values from its mean. Denoted SD(X) or σₓ.' },
        { term: 'Binomial Random Variable', definition: 'A discrete random variable counting successes in n independent trials, each with probability of success p and failure 1 − p.' },
        { term: 'Binomial Mean and Standard Deviation', definition: 'For a binomial random variable: μ = np and σ = √(np(1−p)).' },
        { term: 'Normal Distribution', definition: 'A continuous, unimodal, bell-shaped, symmetric distribution described by its mean μ and standard deviation σ.' },
        { term: 'Empirical Rule', definition: 'For a normal distribution: ~68% of values fall within 1σ of the mean, ~95% within 2σ, and ~99.7% within 3σ. Also called the 68–95–99.7 rule.' },
        { term: 'Sampling Distribution', definition: 'The distribution of values of a statistic for all possible samples of a given size from a given population.' },
        { term: 'Central Limit Theorem (CLT)', definition: 'The sampling distribution of a sample mean can be approximated by a normal distribution. The larger the sample size, the better the approximation.' }
      ];

      const app = document.getElementById('app');
      const flashcard = document.getElementById('flashcard');
      const termText = document.getElementById('termText');
      const definitionText = document.getElementById('definitionText');
      const counter = document.getElementById('counter');
      const progressBar = document.getElementById('progressBar');
      const printGrid = document.getElementById('printGrid');

      let cards = originalCards.slice();
      let currentIndex = 0;
      let isFlipped = false;

      function renderCard() {
        const card = cards[currentIndex];
        termText.textContent = card.term;
        definitionText.textContent = card.definition;
        counter.textContent = 'Card ' + (currentIndex + 1) + ' of ' + cards.length;
        progressBar.style.width = (((currentIndex + 1) / cards.length) * 100) + '%';
        flashcard.classList.toggle('is-flipped', isFlipped);
        flashcard.setAttribute('aria-label', isFlipped ? 'Definition for ' + card.term + '. Click to flip back.' : 'Term: ' + card.term + '. Click to flip.');
      }

      function flipCard() {
        isFlipped = !isFlipped;
        renderCard();
      }

      function moveCard(direction) {
        currentIndex = (currentIndex + direction + cards.length) % cards.length;
        isFlipped = false;
        renderCard();
      }

      function shuffleCards() {
        for (let i = cards.length - 1; i > 0; i -= 1) {
          const randomIndex = Math.floor(Math.random() * (i + 1));
          const temporaryCard = cards[i];
          cards[i] = cards[randomIndex];
          cards[randomIndex] = temporaryCard;
        }
        currentIndex = 0;
        isFlipped = false;
        renderCard();
      }

      function resetDeck() {
        cards = originalCards.slice();
        currentIndex = 0;
        isFlipped = false;
        renderCard();
      }

      function renderPrintCards() {
        printGrid.innerHTML = '';
        originalCards.forEach(function (card, index) {
          const printCard = document.createElement('article');
          printCard.className = 'print-card';

          const term = document.createElement('div');
          term.className = 'print-term';
          term.textContent = (index + 1) + '. ' + card.term;

          const definition = document.createElement('div');
          definition.className = 'print-definition';
          definition.textContent = card.definition;

          printCard.appendChild(term);
          printCard.appendChild(definition);
          printGrid.appendChild(printCard);
        });
      }

      app.addEventListener('click', function (event) {
        const actionTarget = event.target.closest('[data-action]');
        if (!actionTarget || !app.contains(actionTarget)) return;

        const action = actionTarget.dataset.action;
        if (action === 'flip') flipCard();
        if (action === 'previous') moveCard(-1);
        if (action === 'next') moveCard(1);
        if (action === 'shuffle') shuffleCards();
        if (action === 'reset') resetDeck();
        if (action === 'print') window.print();
      });

      app.addEventListener('keydown', function (event) {
        if (event.target !== flashcard && event.target.tagName !== 'BODY') return;

        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          moveCard(-1);
        } else if (event.key === 'ArrowRight') {
          event.preventDefault();
          moveCard(1);
        } else if (event.key === ' ') {
          event.preventDefault();
          flipCard();
        }
      });

      document.addEventListener('wheel', function (event) {
        if (event.target.matches('input[type="number"]')) event.preventDefault();
      }, { passive: false });

      renderPrintCards();
      renderCard();
    });
  </script>
</body>
</html>
