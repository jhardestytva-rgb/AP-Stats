<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Statistics — Unit 4 Flashcards</title>
  <style>
    :root {
      --navy: #0C2340;
      --gold: #FFD600;
      --white: #FFFFFF;
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--navy);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      border: 2px solid var(--gold);
      border-radius: 12px;
      background: var(--navy);
      color: var(--gold);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 0.7rem 1rem;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    button:hover, button:focus-visible {
      background: var(--gold);
      color: var(--navy);
      outline: none;
    }

    button:active { transform: scale(0.97); }
    button * { pointer-events: none; }

    .app {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
      text-align: center;
    }

    header { margin-bottom: 1.5rem; }

    .brand {
      color: var(--gold);
      font-size: clamp(1.2rem, 3vw, 1.65rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0;
      text-transform: uppercase;
    }

    h1 {
      color: var(--white);
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      margin: 0.25rem 0 0;
    }

    .subtitle {
      color: var(--white);
      font-size: 1.05rem;
      margin: 0.45rem 0 0;
      opacity: 0.88;
    }

    .counter {
      color: var(--white);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.55rem;
    }

    .progress-track {
      width: min(560px, 100%);
      height: 7px;
      margin: 0 auto 1.35rem;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
    }

    .progress-bar {
      width: 3.125%;
      height: 100%;
      background: var(--gold);
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .card-scene {
      width: min(560px, 100%);
      height: 320px;
      margin: 0 auto 1.4rem;
      perspective: 1200px;
    }

    .flashcard {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }

    .flashcard.is-flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      border: 3px solid var(--gold);
      border-radius: 12px;
      box-shadow: 0 12px 28px var(--shadow);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      background: var(--navy);
      color: var(--white);
    }

    .card-front h2 {
      margin: 0;
      font-size: clamp(1.55rem, 5vw, 2rem);
      line-height: 1.2;
    }

    .card-back {
      background: var(--white);
      color: var(--navy);
      font-size: 1rem;
      line-height: 1.55;
      text-align: left;
      transform: rotateY(180deg);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.7rem;
      margin: 0 auto 1rem;
    }

    .hint {
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.9rem;
      margin: 0;
    }

    .print-grid { display: none; }

    @media (max-width: 620px) {
      .app { padding-top: 1.35rem; }
      .card-scene { height: 300px; }
      .card-face { padding: 1.4rem; }
      .controls button { flex: 1 1 40%; }
    }

    @media print {
      @page { margin: 0.5in; }

      body { background: var(--navy); }
      .app { width: 100%; max-width: none; padding: 0; }
      header { margin-bottom: 0.35in; }
      .controls, .hint, .counter, .progress-track, .card-scene { display: none !important; }

      .print-grid {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        gap: 0.18in;
      }

      .print-card {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 1.55in;
        overflow: hidden;
        border: 2px solid var(--gold);
        border-radius: 12px;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .print-term, .print-definition {
        display: flex;
        align-items: center;
        padding: 0.18in;
      }

      .print-term {
        justify-content: center;
        background: var(--navy);
        color: var(--white);
        font-size: 0.82rem;
        font-weight: 700;
        text-align: center;
      }

      .print-definition {
        background: var(--white);
        border-left: 2px dashed var(--navy);
        color: var(--navy);
        font-size: 0.69rem;
        line-height: 1.3;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header>
      <p class="brand">AP Statistics</p>
      <h1>AP Statistics — Unit 4 Flashcards</h1>
      <p class="subtitle">Unit 4: Inference for Quantitative Data: Means</p>
    </header>

    <div class="counter" id="counter" aria-live="polite">Card 1 of 32</div>
    <div class="progress-track" aria-label="Deck progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <section class="card-scene" aria-label="Current flashcard">
      <div class="flashcard" id="flashcard" data-action="flip" tabindex="0" role="button" aria-label="Flashcard. Click to flip.">
        <div class="card-face card-front">
          <h2 id="termText"></h2>
        </div>
        <div class="card-face card-back">
          <p id="definitionText"></p>
        </div>
      </div>
    </section>

    <div class="controls">
      <button type="button" data-action="previous">Previous</button>
      <button type="button" data-action="next">Next</button>
      <button type="button" data-action="shuffle">Shuffle</button>
      <button type="button" data-action="print">Print All Cards</button>
      <button type="button" data-action="reset">Reset Order</button>
    </div>

    <p class="hint">Click the card to flip • Use ← → to navigate • Press Space to flip</p>
    <section class="print-grid" id="printGrid" aria-label="Printable flashcards"></section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const originalCards = [
        { term: 't-Distribution', definition: 'A family of symmetric, bell-shaped probability distributions used for inference about a population mean when the population standard deviation is unknown and the sample standard deviation s is used. Its tails are heavier than the standard normal distribution.' },
        { term: 'Degrees of Freedom (for t)', definition: 'The number of independent pieces of information used to estimate variability. For a one-sample t procedure, df = n − 1; for a two-sample t procedure, AP Statistics uses the calculator’s unpooled degrees of freedom.' },
        { term: 'One-Sample t-Interval for a Mean', definition: 'An interval estimate for one population mean μ: x̄ ± t* (s/√n), provided the conditions for inference about a mean are satisfied.' },
        { term: 'One-Sample t-Test for a Mean', definition: 'A significance test for one population mean. The test statistic is t = (x̄ − μ₀)/(s/√n), with df = n − 1, when the conditions are met.' },
        { term: 'Two-Sample t-Interval for a Difference in Means', definition: 'An interval estimate for μ₁ − μ₂: (x̄₁ − x̄₂) ± t*√(s₁²/n₁ + s₂²/n₂), using an unpooled t procedure when conditions are satisfied.' },
        { term: 'Two-Sample t-Test for a Difference in Means', definition: 'A significance test comparing two population means. The statistic is t = [(x̄₁ − x̄₂) − (μ₁ − μ₂)₀]/√(s₁²/n₁ + s₂²/n₂); under the usual null hypothesis, (μ₁ − μ₂)₀ = 0.' },
        { term: 'Paired t-Test (Matched Pairs)', definition: 'A one-sample t-test applied to the differences within matched pairs or to before-and-after measurements on the same subjects. Analyze one difference for each pair.' },
        { term: 'Paired t-Interval', definition: 'A confidence interval for the population mean difference μd, calculated as d̄ ± t* (sd/√n), where d is the difference within each pair.' },
        { term: 'Standard Error of the Mean', definition: 'The estimated standard deviation of the sampling distribution of x̄: SE = s/√n. It measures the typical sampling variability of the sample mean.' },
        { term: 'Point Estimate', definition: 'A single statistic used to estimate a population parameter. For a population mean μ, the point estimate is the sample mean x̄.' },
        { term: 'Margin of Error', definition: 'The amount added to and subtracted from a point estimate to create a confidence interval. For a t-interval, ME = t* × SE.' },
        { term: 'Critical Value (t*)', definition: 'The t-value that marks the boundary of the middle confidence area for a stated confidence level and degrees of freedom. It determines the margin of error.' },
        { term: 'Null Hypothesis for Means (H₀)', definition: 'A statement about a population mean or difference in population means that is assumed true for the test. It commonly states μ = μ₀ or μ₁ − μ₂ = 0.' },
        { term: 'Alternative Hypothesis for Means (Hₐ)', definition: 'A statement that contradicts H₀ and describes the population mean or difference in means for which the test seeks evidence: less than, greater than, or not equal to a null value.' },
        { term: 'p-value', definition: 'The probability, assuming H₀ is true, of obtaining a test statistic at least as extreme as the observed statistic in the direction specified by Hₐ.' },
        { term: 'Conditions for Inference', definition: 'The requirements that justify a t procedure: Random data, Normal/Large Sample, and Independent observations. For sampling without replacement, independence is often checked with the 10% condition.' },
        { term: 'Random Condition', definition: 'The data come from a random sample, a randomized experiment, or another chance process that justifies statistical inference.' },
        { term: 'Normal/Large Sample Condition', definition: 'The population distribution is approximately Normal, or the sample is large enough for the t procedure to be reasonably robust. Check for strong skewness, outliers, or other departures from Normality.' },
        { term: 'Independence / 10% Condition', definition: 'Observations should be independent. When sampling without replacement, the sample size should be no more than 10% of the population size.' },
        { term: 'Central Limit Theorem for Means', definition: 'For sufficiently large random samples, the sampling distribution of x̄ is approximately Normal, even when the population distribution is not Normal, provided there are no extreme violations such as strong skewness or outliers.' },
        { term: 'Sampling Distribution of x̄', definition: 'The probability distribution of all possible sample means x̄ from samples of a fixed size n selected by the same method from a population.' },
        { term: 'Mean of the Sampling Distribution of x̄', definition: 'The mean of the sampling distribution of x̄ equals the population mean: μx̄ = μ. Thus, x̄ is an unbiased estimator of μ.' },
        { term: 'Standard Deviation of the Sampling Distribution of x̄', definition: 'The standard deviation of the sampling distribution of x̄ is σx̄ = σ/√n when the population standard deviation σ is known. The standard error estimates it with s/√n.' },
        { term: 'Robust Procedure', definition: 'A procedure whose results are not greatly affected by moderate departures from an assumption. t procedures are generally robust to moderate non-Normality when the sample is reasonably large and there are no extreme outliers.' },
        { term: 'Pooled vs. Unpooled', definition: 'Pooled procedures combine sample variability under an assumption of equal population variances. AP Statistics uses the unpooled two-sample t procedure, which does not assume equal variances.' },
        { term: 'Statistically Significant', definition: 'A result is statistically significant at level α when the p-value is less than or equal to α, providing sufficient evidence to reject H₀ in favor of Hₐ.' },
        { term: 'Type I Error', definition: 'Rejecting H₀ when H₀ is true; a false positive. When a test is conducted at significance level α, the probability of a Type I error is α.' },
        { term: 'Type II Error', definition: 'Failing to reject H₀ when H₀ is false; a false negative.' },
        { term: 'Power of a Test', definition: 'The probability that a test correctly rejects H₀ when a particular alternative value is true. Power = 1 − P(Type II error).' },
        { term: 'Conclusion in Context for Means', definition: 'The final interpretation of a test stated in terms of the population means and the question. Say “reject H₀” or “fail to reject H₀,” report the evidence from the p-value, and describe what the result means in context.' },
        { term: 'Confidence Level', definition: 'The long-run capture rate of a confidence-interval method. A 95% confidence level means that in many repetitions, about 95% of intervals constructed by the method would capture the true population parameter.' },
        { term: 'Interpretation of a Confidence Interval', definition: 'A correct interpretation identifies the population parameter and states that we are confident the interval from the sample provides plausible values for that parameter. It does not say that the fixed parameter has a probability of being in this particular interval.' },
        { term: 'Interpretation of a Confidence Level', definition: 'A confidence level describes the success rate of the interval-generating method over repeated random samples, not the probability that one completed interval contains the parameter.' }
      ];

      const app = document.getElementById('app');
      const flashcard = document.getElementById('flashcard');
      const termText = document.getElementById('termText');
      const definitionText = document.getElementById('definitionText');
      const counter = document.getElementById('counter');
      const progressBar = document.getElementById('progressBar');
      const printGrid = document.getElementById('printGrid');

      let cards = originalCards.slice();
      let currentIndex = 0;
      let isFlipped = false;

      function renderCard() {
        const card = cards[currentIndex];
        termText.textContent = card.term;
        definitionText.textContent = card.definition;
        counter.textContent = 'Card ' + (currentIndex + 1) + ' of ' + cards.length;
        progressBar.style.width = (((currentIndex + 1) / cards.length) * 100) + '%';
        flashcard.classList.toggle('is-flipped', isFlipped);
        flashcard.setAttribute('aria-label', isFlipped ? 'Definition for ' + card.term + '. Click to flip back.' : 'Term: ' + card.term + '. Click to flip.');
      }

      function flipCard() {
        isFlipped = !isFlipped;
        renderCard();
      }

      function moveCard(direction) {
        currentIndex = (currentIndex + direction + cards.length) % cards.length;
        isFlipped = false;
        renderCard();
      }

      function shuffleCards() {
        for (let i = cards.length - 1; i > 0; i -= 1) {
          const randomIndex = Math.floor(Math.random() * (i + 1));
          const temporaryCard = cards[i];
          cards[i] = cards[randomIndex];
          cards[randomIndex] = temporaryCard;
        }
        currentIndex = 0;
        isFlipped = false;
        renderCard();
      }

      function resetDeck() {
        cards = originalCards.slice();
        currentIndex = 0;
        isFlipped = false;
        renderCard();
      }

      function renderPrintCards() {
        printGrid.innerHTML = '';
        originalCards.forEach(function (card, index) {
          const printCard = document.createElement('article');
          printCard.className = 'print-card';

          const term = document.createElement('div');
          term.className = 'print-term';
          term.textContent = (index + 1) + '. ' + card.term;

          const definition = document.createElement('div');
          definition.className = 'print-definition';
          definition.textContent = card.definition;

          printCard.appendChild(term);
          printCard.appendChild(definition);
          printGrid.appendChild(printCard);
        });
      }

      app.addEventListener('click', function (event) {
        const actionTarget = event.target.closest('[data-action]');
        if (!actionTarget || !app.contains(actionTarget)) return;

        const action = actionTarget.dataset.action;
        if (action === 'flip') flipCard();
        if (action === 'previous') moveCard(-1);
        if (action === 'next') moveCard(1);
        if (action === 'shuffle') shuffleCards();
        if (action === 'reset') resetDeck();
        if (action === 'print') window.print();
      });

      app.addEventListener('keydown', function (event) {
        if (event.target !== flashcard && event.target.tagName !== 'BODY') return;

        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          moveCard(-1);
        } else if (event.key === 'ArrowRight') {
          event.preventDefault();
          moveCard(1);
        } else if (event.key === ' ') {
          event.preventDefault();
          flipCard();
        }
      });

      renderPrintCards();
      renderCard();
    });
  </script>
</body>
</html>
